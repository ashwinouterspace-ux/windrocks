<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 95vw;
            margin: 0 auto 10px;
            font-size: 18px;
        }

        canvas {
            display: block;
            margin: auto;
            background: #0f172a;
            border: 3px solid #64748b;
            border-radius: 8px;
            max-width: 95vw;
            height: auto;
        }

        .controls {
            margin-top: 12px;
            color: #cbd5e1;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            position: absolute;
            font-size: 30px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>Brick Breaker</h1>

    <div class="info">
        <span>Score: <strong id="score">0</strong></span>
        <span>Level: <strong id="level">1</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="controls">
        ← Move Left &nbsp;&nbsp; → Move Right &nbsp;&nbsp;
        ⏸ Space = Pause
    </div>

    <button id="restartButton">Restart Game</button>

</div>
<script src="Javascript/dumi_bum_brik_breaker.js"></script>

</body>
</html>
